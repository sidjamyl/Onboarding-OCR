name: ocr-onboarding

x-backend-environment: &backend-environment
  NODE_ENV: ${ONBOARDING_NODE_ENV:-production}
  REPOSITORY_DRIVER: postgres
  STORAGE_DRIVER: minio
  QUEUE_DRIVER: pg-boss
  DATABASE_URL: postgres://${POSTGRES_USER:-onboarding}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-onboarding}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  CLIENT_API_KEYS: ${CLIENT_API_KEYS}
  CLIENT_APPLICATIONS_JSON: ${CLIENT_APPLICATIONS_JSON:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-onboarding-captures}
  OCR_BASE_URL: ${OCR_BASE_URL}
  OCR_BASIC_USERNAME: ${OCR_BASIC_USERNAME}
  OCR_BASIC_PASSWORD: ${OCR_BASIC_PASSWORD}
  OCR_TIMEOUT_MS: ${OCR_TIMEOUT_MS:-200000}
  WEBHOOK_URL: ${WEBHOOK_URL:-}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET}
  REQUIRED_FIELDS_JSON: ${REQUIRED_FIELDS_JSON:-}
  QUALITY_LAB_ENABLED: ${QUALITY_LAB_ENABLED:-false}
  QUALITY_MODE: ${QUALITY_MODE:-observe}
  SERVER_QUALITY_CHECKS_ENABLED: ${SERVER_QUALITY_CHECKS_ENABLED:-true}
  QUALITY_PROFILE_JSON: ${QUALITY_PROFILE_JSON:-}
  ONBOARDING_DEMO_TRACE: ${ONBOARDING_DEMO_TRACE:-false}
  ONBOARDING_TRACE_DIRECTORY: /app/traces
  TEMPLATE_DIRECTORY: /app/templates

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onboarding}
      POSTGRES_USER: ${POSTGRES_USER:-onboarding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onboarding} -d ${POSTGRES_DB:-onboarding}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z-amd64@sha256:72b4794d7faa001823364f8ee239717141327fc450a3264414f573a6abf3c629
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-environment
      HOST: 0.0.0.0
      PORT: 8090
      QUEUE_CONSUMER: "false"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes:
      - template-data:/app/templates
      - ${ONBOARDING_DATA_DIR:-./backend/.local}/traces:/app/traces
      - ${ONBOARDING_DATA_DIR:-./backend/.local}/admin:/app/.local
    ports:
      - "${ONBOARDING_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    environment:
      <<: *backend-environment
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      - template-data:/app/templates
      - ${ONBOARDING_DATA_DIR:-./backend/.local}/traces:/app/traces

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_ONBOARDING_API_URL: ${BROWSER_API_URL:-/api/onboarding}
        NEXT_PUBLIC_QUALITY_LAB_ENABLED: ${QUALITY_LAB_ENABLED:-false}
        NEXT_PUBLIC_DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-false}
        NEXT_PUBLIC_OCR_SLOW_THRESHOLD_MS: ${OCR_SLOW_THRESHOLD_MS:-20000}
    restart: unless-stopped
    environment:
      ONBOARDING_API_URL: http://backend:8090
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ONBOARDING_API_KEY: ${ONBOARDING_API_KEY}
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-false}
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${ONBOARDING_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"

  backup:
    profiles: ["backup"]
    build:
      context: ./ops
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-onboarding}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-onboarding}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-onboarding-captures}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  postgres-data:
  minio-data:
  template-data:
