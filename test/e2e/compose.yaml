services:
  minio:
    environment:
      MINIO_ROOT_PASSWORD: e2e-minio-secret-123456789

  mock-ocr:
    image: node:22-alpine
    command: ["node", "/mock/mock-ocr.mjs"]
    volumes:
      - ./test/e2e/mock-ocr.mjs:/mock/mock-ocr.mjs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:18080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

  backend:
    environment:
      NODE_ENV: test
      SERVER_QUALITY_CHECKS_ENABLED: "false"
      OCR_BASE_URL: http://mock-ocr:18080
      OCR_BASIC_PASSWORD: e2e-ocr-password-123456789
      CLIENT_API_KEYS: e2e-client-key-123456789
      MINIO_SECRET_KEY: e2e-minio-secret-123456789
    depends_on:
      mock-ocr: { condition: service_healthy }

  worker:
    environment:
      NODE_ENV: test
      SERVER_QUALITY_CHECKS_ENABLED: "false"
      OCR_BASE_URL: http://mock-ocr:18080
      OCR_BASIC_PASSWORD: e2e-ocr-password-123456789
      CLIENT_API_KEYS: e2e-client-key-123456789
      MINIO_SECRET_KEY: e2e-minio-secret-123456789
    depends_on:
      mock-ocr: { condition: service_healthy }

  frontend:
    build:
      args:
        NEXT_PUBLIC_DEMO_MODE_ENABLED: "true"
    environment:
      DEMO_MODE_ENABLED: "true"
      ONBOARDING_API_KEY: e2e-client-key-123456789
